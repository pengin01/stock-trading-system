name: Daily Paper Trade v531

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: |
          [ -f positions.csv ] || echo "ticker,entry_price,entry_date,qty" > positions.csv
          [ -f trades.csv ] || echo "ticker,entry_price,exit_price,entry_date,exit_date,reason" > trades.csv
          [ -f candidates.csv ] || echo "ticker,price" > candidates.csv

      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python v531_daily_paper.py

      - run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add -f positions.csv trades.csv candidates.csv
          git commit -m "update" || echo "no change"
          git push