name: v616 Low Cap 20K Daily

on:
  schedule:
    # JST 07:30 = UTC 22:30
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Init CSV files if missing
        run: |
          if [ ! -f positions_v616_20k.csv ]; then
            echo "ticker,entry_date,entry_price,shares,cost,score" > positions_v616_20k.csv
          fi

          if [ ! -f trades_v616_20k.csv ]; then
            echo "ticker,entry_date,exit_date,entry_price,exit_price,shares,cost,proceeds,pnl,return,reason,score" > trades_v616_20k.csv
          fi

          if [ ! -f equity_v616_20k.csv ]; then
            echo "run_date,signal_date,cash,position_value,equity,position_count" > equity_v616_20k.csv
          fi

          if [ ! -f candidates_v616_20k.csv ]; then
            echo "run_date,signal_date,ticker,close,score,ret3,value20" > candidates_v616_20k.csv
          fi

      - name: Run v616 daily
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python v616_low_cap_20k_daily.py

      - name: Commit result files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f positions_v616_20k.csv trades_v616_20k.csv equity_v616_20k.csv candidates_v616_20k.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update v616 daily paper results"
            git push
          fi
